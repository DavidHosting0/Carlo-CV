<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlo CV – Bewerbungs-Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1 class="brand">Carlo CV</h1>
          <p class="brand-sub">Bewerbungen &amp; gefundene Stellen</p>
        </div>
      </header>

      <section class="stats" id="stats" aria-label="Kennzahlen"></section>

      <nav class="tabs" role="tablist" aria-label="Bereiche">
        <button
          type="button"
          class="tab"
          role="tab"
          data-tab="bewerbungen"
          aria-selected="true"
          aria-controls="panel-bewerbungen"
          id="tab-bewerbungen"
        >
          Bewerbungen
        </button>
        <button
          type="button"
          class="tab"
          role="tab"
          data-tab="jobs"
          aria-selected="false"
          aria-controls="panel-jobs"
          id="tab-jobs"
        >
          Gefundene Jobs
        </button>
      </nav>

      <section
        class="panel"
        id="panel-bewerbungen"
        role="tabpanel"
        aria-labelledby="tab-bewerbungen"
      >
        <div class="filters">
          <input
            type="search"
            id="filter-search"
            placeholder="Suche Firma, Titel, Ort…"
            aria-label="Bewerbungen durchsuchen"
          />
          <select id="filter-quelle" aria-label="Quelle filtern">
            <option value="alle">Alle Quellen</option>
            <option value="kuratiert">Kuratiert</option>
            <option value="scraper">Scraper</option>
          </select>
          <select id="filter-status" aria-label="Status filtern">
            <option value="alle">Alle Status</option>
            <option value="entwurf">Entwurf</option>
            <option value="versendet">Versendet</option>
            <option value="gespraech">Gespräch</option>
            <option value="absage">Absage</option>
            <option value="zusage">Zusage</option>
          </select>
        </div>
        <div class="list" id="bewerbungen-list"></div>
      </section>

      <section
        class="panel"
        id="panel-jobs"
        role="tabpanel"
        aria-labelledby="tab-jobs"
        hidden
      >
        <div class="filters">
          <input
            type="search"
            id="job-search"
            placeholder="Suche Firma, Titel, Ort…"
            aria-label="Jobs durchsuchen"
          />
          <select id="job-mappe" aria-label="Mappe filtern">
            <option value="alle">Alle Jobs</option>
            <option value="mit">Mit Mappe</option>
            <option value="ohne">Ohne Mappe</option>
          </select>
        </div>
        <div class="list" id="jobs-list"></div>
      </section>

      <p class="footnote">
        Status wird lokal im Browser gespeichert. Datenpflege über
        <code>dashboard/data.js</code>.
      </p>
    </div>

    <script src="dashboard/data.js"></script>
    <script src="dashboard/app.js"></script>
  </body>
</html>
