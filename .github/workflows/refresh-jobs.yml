name: Refresh scraped jobs

on:
  workflow_dispatch:
  schedule:
    # Täglich ca. 07:30 Schweizer Winterzeit
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Scrape, geocode, evaluate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_TERM: Verkäufer
          LOCATION: Bern
          MAX_RESULTS: "15"
          OUTPUT_FILE: jobs.json
        run: python refresh_jobs.py

      - name: Commit live-jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/live-jobs.json
          if git diff --staged --quiet; then
            echo "No changes to dashboard/live-jobs.json"
          else
            git commit -m "chore: refresh dashboard live-jobs from jobs.ch"
            git push
          fi
